<!DOCTYPE html>
<html>
<head>
  <title>Recorded Rounds</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/modal-theme.css">
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; color: #f0f0f0; font-family: 'Segoe UI', sans-serif; }
    .nav-bar { background: #000; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
    .nav-btn { background: #222; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid #444; margin-left: 10px; transition: all 0.2s; }
    .nav-btn:hover { background: #333; }
    .nav-btn.active { background: #c5a000; color: #000; border-color: #c5a000; }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #666; background: #161616; border: 2px solid #333; border-radius: 8px; margin-top: 40px; }
    .empty-state h2 { font-size: 24px; margin-bottom: 10px; color: #c5a000; }
    code { color: #c5a000; background: #000; padding: 2px 6px; border-radius: 3px; }
    .btn-primary { background: #4CAF50; border-color: #4CAF50; padding: 12px 24px; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 700; display: inline-block; margin-top: 20px; }
    .btn-primary:hover { background: #45a049; }
  </style>
</head>
<body>

<div class="nav-bar">
  <div><h2 style="margin: 0; color: #c5a000;">📂 Recorded Rounds</h2></div>
  <div>
    <a href="/" class="nav-btn">🏠 Main</a>
    <a href="/camera" class="nav-btn">📹 Camera</a>
    <a href="/settings" class="nav-btn">⚙️ Settings</a>
    <a href="/rounds" class="nav-btn active">📂 Rounds</a>
    <a href="/spectator_fullscreen" class="nav-btn">👥 Spectator</a>
    <a href="/help" class="nav-btn">❓ Help</a>
  </div>
</div>

<div class="container">
  <div class="empty-state">
    <h2>📂 Rounds Viewer</h2>
    <p>This feature displays recorded rounds and shot images.</p>
    <p style="margin-top: 20px; color: #888;">
      Recording is enabled in Settings → Shot Recording<br>
      Rounds are saved to: <code id="shotDirectory">Loading...</code>
    </p>
    <a href="/" class="btn-primary">Go to Main Page</a>
    <a href="/settings" class="btn-primary" style="margin-left: 10px;">Configure Recording</a>
  </div>
</div>

<script src="/static/modal-theme.js"></script>
<script>
window.onload = async function() {
  try {
    const response = await fetch('/get_config');
    const config = await response.json();
    document.getElementById('shotDirectory').textContent = config.shot_directory || '/home/admin/air-target/shots';
  } catch (err) {
    document.getElementById('shotDirectory').textContent = 'Error loading path';
  }
};
</script>

</body>
</html>
